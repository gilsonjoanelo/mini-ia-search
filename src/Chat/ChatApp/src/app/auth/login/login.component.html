<mat-card class="login-container">
  <mat-card-header>
    <mat-card-title>
      {{ isRegister ? 'Criar conta' : 'Entrar' }}
    </mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form (ngSubmit)="submit()" #loginForm="ngForm">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Usuário</mat-label>
        <input
          matInput
          [(ngModel)]="username"
          name="username"
          required
        />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Senha</mat-label>
        <input
          matInput
          [(ngModel)]="password"
          name="password"
          type="password"
          required
        />
      </mat-form-field>

      <div class="actions">
        <button mat-raised-button color="primary" type="submit">
          {{ isRegister ? 'Registrar' : 'Login' }}
        </button>
      </div>
    </form>

    <p class="error" *ngIf="error">{{ error }}</p>
  </mat-card-content>

  <mat-card-actions>
    <button mat-button color="accent" (click)="isRegister = !isRegister">
      {{ isRegister ? 'Já tenho conta' : 'Criar uma conta' }}
    </button>
  </mat-card-actions>
</mat-card>
