<!-- src/app/chat/chat.component.html -->
<div class="chat-container">
  <div class="sidebar">
    <h3>Mensagens privadas</h3>
    <input placeholder="Destinatário (username)" [(ngModel)]="recipient" />
  </div>

  <div class="chat-main">
    <h2>Chat público</h2>
    <div class="messages">
      <div class="msg" *ngFor="let m of publicMessages">
        <b>{{ m.sender }}</b>: {{ m.content }} <small>{{ m.at | date:'short' }}</small>
      </div>
    </div>

    <h2>Privadas</h2>
    <div class="messages">
      <div class="msg" *ngFor="let m of privateMessages">
        <b>{{ m.sender }}</b>: {{ m.content }} <small>{{ m.at | date:'short' }}</small>
      </div>
    </div>

    <div class="composer">
      <input [(ngModel)]="text" placeholder="Sua mensagem..." (keyup.enter)="send()" />
      <button (click)="send()">Enviar</button>
    </div>
  </div>
</div>
