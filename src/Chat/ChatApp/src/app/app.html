<div [class.dark-theme]="isDarkMode">

    <span>Meu Chat</span>
    <span class="spacer"></span>
    <button mat-icon-button (click)="toggleTheme()">
      <mat-icon>{{ isDarkMode ? 'brightness_7' : 'brightness_4' }}</mat-icon>
    </button>
  </mat-toolbar>

  <router-outlet></router-outlet>
</div>
